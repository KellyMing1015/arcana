name: Arcana tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARCANA_MEMORY_MODEL_BASE_URL: ""
      ARCANA_MEMORY_MODEL_API_KEY: ""
      ARCANA_MEMORY_MODEL: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Check backend and isolated data flows
        env:
          ARCANA_DATABASE: ${{ runner.temp }}/arcana-test-bootstrap.db
        run: python -m unittest discover -s tests -v
      - name: Check frontend image loads, streaming and account flows
        run: node --test tests/test_frontend_*.mjs
      - name: Check browser script syntax
        run: |
          for script in app.js auth.js cards.js settings.js home-view.js; do
            node --input-type=module --check < "$script"
          done
